<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AStack Timeline</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="timeline-view" class="panel-view">
    <div id="beast-glow-slot" class="beast-slot" aria-hidden="true"></div>
    <div id="beast-toast-slot" class="beast-slot"></div>
    <header class="header">
      <div class="header-row">
        <img class="brand-logo" src="/logo.svg" alt="" width="18" height="18" aria-hidden="true">
        <h1 class="title">AStack Timeline</h1>
        <div id="panel-mode-switcher" class="mode-switcher" role="group" aria-label="Panel mode" data-testid="panel-mode-switcher">
          <button id="mode-btn-build" type="button" class="subcmd-pill is-sans" data-panel-mode="build" data-testid="mode-switch-build" aria-pressed="true">Build</button>
          <button id="mode-btn-review" type="button" class="subcmd-pill is-sans" data-panel-mode="review_pr" data-testid="mode-switch-review-pr" aria-pressed="false">Review PR</button>
        </div>
        <span id="progress" class="progress" data-testid="timeline-progress">0 / 4</span>
        <span id="live" class="live" role="status" data-testid="timeline-live">
          <span class="live-dot" aria-hidden="true"></span>
          <span id="live-label">Idle</span>
        </span>
      </div>
      <div id="meta-row" class="meta-row hidden" data-testid="timeline-meta"></div>
      <div id="setup-drawer" class="setup-drawer hidden" data-testid="timeline-setup-drawer"></div>
      <div id="beast-drawer" class="setup-drawer hidden" data-testid="timeline-beast-drawer"></div>
    </header>

    <section id="promo-wrap" class="setup-wrap hidden" aria-label="Category trust promotion">
      <div id="promo-card" class="setup-card hidden" data-testid="timeline-promo"></div>
    </section>

    <section id="setup-wrap" class="setup-wrap hidden" aria-label="First-time repository setup">
      <div id="setup-card" class="setup-card hidden" data-testid="timeline-setup"></div>
    </section>

    <div id="focus-strip" class="focus-strip" role="group" aria-label="Activity totals" data-testid="focus-strip"></div>
    <div id="focus-artifacts" class="focus-artifacts hidden" data-testid="focus-artifacts"></div>
    <section id="status-banner-wrap" class="status-banner-wrap hidden" aria-label="Current workflow status">
      <div id="status-banner" class="status-banner" data-testid="timeline-status-banner"></div>
    </section>

    <main class="main">
      <div id="timeline-wrap" class="timeline-wrap">
        <canvas id="living-rail" class="living-rail" aria-hidden="true"></canvas>
        <ol id="timeline" class="timeline" aria-label="AStack engineering workflow timeline" data-testid="timeline-list"></ol>
      </div>
      <section id="prior-cycles-wrap" class="prior-cycles-wrap hidden" aria-label="Previous cycles" data-testid="prior-cycles-wrap"></section>
      <div id="rail-announcer" class="sr-only" aria-live="polite" data-testid="rail-announcer"></div>
      <section id="colleague-review-panel" class="colleague-review-panel hidden" aria-label="Colleague PR Review" data-testid="colleague-review-panel"></section>
    </main>

    <div class="bottom-dock">
      <form id="btw-form" class="askbar" data-testid="btw-form">
        <span id="askbar-icon" class="askbar-icon" aria-hidden="true"></span>
        <label for="astk-btw" class="sr-only">Side question</label>
        <input id="astk-btw" type="text" autocomplete="off" placeholder="Ask a side question without interrupting the agents">
        <button id="btw-submit" type="submit" class="btw-submit" data-testid="btw-submit">/btw</button>
      </form>
      <footer id="panel-footer" class="panel-footer" data-testid="timeline-footer"></footer>
    </div>
  </div>

  <div id="trust-view" class="panel-view delegate-view hidden" aria-hidden="true" data-testid="trust-view"></div>
  <div id="dossier-view" class="panel-view delegate-view hidden" aria-hidden="true" data-testid="dossier-view"></div>
  <div id="audit-view" class="panel-view delegate-view hidden" aria-hidden="true" data-testid="audit-view"></div>
  <div id="delegate-view" class="panel-view delegate-view hidden" aria-hidden="true" data-testid="delegate-view"></div>
  <div id="artifact-view" class="panel-view artifact-view hidden" aria-hidden="true" data-testid="artifact-view"></div>

  <div id="cmd-popover" class="cmd-popover hidden" role="tooltip" data-testid="cmd-popover"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" data-testid="timeline-toast"></div>
  <script src="/living-rail.js"></script>
  <script src="/catalog.js"></script>
  <script src="/app.js"></script>
</body>
</html>
