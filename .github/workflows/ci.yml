name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-test:
    name: Validate & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate AStack plugin structure and links
        run: node scripts/validate-astack.mjs --no-agy

      - name: Run plugin validator and hook tests
        run: node --test scripts/test/*.test.mjs

      - name: Run workflow helper tests
        run: node --experimental-strip-types --test skills/astack-mode/scripts/check-plan.test.ts skills/astack-mode/scripts/worktree-audit.test.mjs skills/show-me-your-work/scripts/log.test.mjs
