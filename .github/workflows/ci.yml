name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-test:
    name: Validate & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate AStack plugin structure and links
        run: node scripts/validate-astack.mjs --no-agy

      - name: Run plugin validator and hook tests
        run: node --run test:plugin

      - name: Run workflow helper tests
        run: node --run test:helpers

      - name: Run watch-pr tests
        run: node --run test:watch-pr

      - name: Run statechart tests
        run: node --run test:statechart

      - name: Run trust core, PR dossier, and architecture audit tests
        run: node --run test:trust

      - name: Run security-audit validator tests
        run: node --run test:security-audit

      - name: Run routing and incident-replay eval tests
        run: node --run test:eval

      - name: Audit AStack module boundaries
        run: node skills/audit-architecture/scripts/arch-audit.mjs --cwd . --strict
