name: PR Proof Contract

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-proof-contract:
    name: Validate PR Proof Contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate PR statechart and verification proof block
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node -e '
            import("node:child_process").then(({ spawnSync }) => {
              const res = spawnSync(
                process.execPath,
                ["skills/pre-pr/scripts/pr-dossier.mjs", "--check-pr-body", "-"],
                { input: process.env.PR_BODY ?? "", stdio: ["pipe", "inherit", "inherit"] }
              );
              process.exit(res.status ?? 1);
            });
          '
