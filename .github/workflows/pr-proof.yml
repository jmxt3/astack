name: PR Proof Contract

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-proof-contract:
    name: Validate PR Proof Contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch base branch policy ref
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate PR verification proof contract
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node -e '
            import("node:child_process").then(({ spawnSync }) => {
              const args = ["skills/pre-pr/scripts/pr-dossier.mjs", "--check-pr-body", "-"];
              if (process.env.BASE_REF) {
                args.push("--base", `origin/${process.env.BASE_REF}`);
              }
              const res = spawnSync(
                process.execPath,
                args,
                { input: process.env.PR_BODY ?? "", stdio: ["pipe", "inherit", "inherit"] }
              );
              process.exit(res.status ?? 1);
            });
          '
